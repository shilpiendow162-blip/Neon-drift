<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Drift 2077 - Laser Edition</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #05050a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 750px;
      background: #090a16;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ui-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(9, 10, 22, 0.85);
      backdrop-filter: blur(4px);
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 38px;
      letter-spacing: 2px;
      color: #00f3ff;
      text-shadow: 0 0 15px #00f3ff;
    }

    p {
      color: #a0a5c0;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }

    .stats-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 8px;
      padding: 12px 24px;
      margin-bottom: 25px;
    }

    .stats-box div {
      font-size: 18px;
      margin: 4px 0;
    }

    .val {
      color: #ff007f;
      font-weight: bold;
      text-shadow: 0 0 8px #ff007f;
    }

    button {
      background: linear-gradient(135deg, #00f3ff, #ff007f);
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="startMenu" class="ui-overlay">
      <h1>NEON DRIFT</h1>
      <p>Drag anywhere on screen to guide your ship.<br>Twin auto-lasers will blast asteroids automatically!</p>
      <div class="stats-box">
        <div>Best Score: <span id="startHighScore" class="val">0</span></div>
      </div>
      <button id="startBtn">LAUNCH SHIP</button>
    </div>

    <div id="gameOverMenu" class="ui-overlay" style="display: none;">
      <h1 style="color: #ff007f; text-shadow: 0 0 15px #ff007f;">CRASHED!</h1>
      <div class="stats-box">
        <div>Score: <span id="finalScore" class="val">0</span></div>
        <div>Best Score: <span id="gameHighScore" class="val">0</span></div>
      </div>
      <button id="restartBtn">RETRY</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('game-wrapper');

    const startMenu = document.getElementById('startMenu');
    const gameOverMenu = document.getElementById('gameOverMenu');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const startHighScoreEl = document.getElementById('startHighScore');
    const gameHighScoreEl = document.getElementById('gameHighScore');
    const finalScoreEl = document.getElementById('finalScore');

    let W, H;
    function resize() {
      W = canvas.width = wrapper.clientWidth;
      H = canvas.height = wrapper.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('neon_drift_highscore') || 0;
    startHighScoreEl.textContent = highScore;

    let shakeTime = 0;
    let frame = 0;

    const player = {
      x: W / 2,
      y: H - 100,
      targetX: W / 2,
      targetY: H - 100,
      radius: 14,
      color: '#00f3ff'
    };

    let enemies = [];
    let gems = [];
    let lasers = [];
    let particles = [];

    function spawnEnemy() {
      const size = Math.random() * 15 + 12;
      enemies.push({
        x: Math.random() * (W - size * 2) + size,
        y: -size,
        radius: size,
        speed: Math.random() * 2 + 2.5 + (score * 0.002),
        color: '#ff0055',
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.1
      });
    }

    function spawnGem() {
      gems.push({
        x: Math.random() * (W - 40) + 20,
        y: -20,
        radius: 10,
        speed: 2.5,
        color: '#00f3ff'
      });
    }

    function spawnLasers() {
      // Twin wingtip lasers
      const laserSpeed = 12;
      const laserWidth = 3;
      const laserHeight = 14;

      lasers.push({
        x: player.x - 10,
        y: player.y - 6,
        vy: -laserSpeed,
        w: laserWidth,
        h: laserHeight,
        color: '#ff007f'
      });

      lasers.push({
        x: player.x + 10,
        y: player.y - 6,
        vy: -laserSpeed,
        w: laserWidth,
        h: laserHeight,
        color: '#ff007f'
      });
    }

    function createExplosion(x, y, color, count = 15) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1,
          color: color,
          alpha: 1
        });
      }
    }

    function handlePointerMove(e) {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      player.targetX = clientX - rect.left;
      player.targetY = clientY - rect.top - 30; // Offset finger
    }

    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handlePointerMove(e);
    }, { passive: false });
    window.addEventListener('touchstart', (e) => {
      if (isPlaying) e.preventDefault();
      handlePointerMove(e);
    }, { passive: false });

    function startGame() {
      score = 0;
      enemies = [];
      gems = [];
      lasers = [];
      particles = [];
      player.x = W / 2;
      player.y = H - 100;
      player.targetX = W / 2;
      player.targetY = H - 100;
      isPlaying = true;

      startMenu.style.display = 'none';
      gameOverMenu.style.display = 'none';
      gameLoop();
    }

    function gameOver() {
      isPlaying = false;
      shakeTime = 20;
      createExplosion(player.x, player.y, '#ff007f', 40);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('neon_drift_highscore', highScore);
      }

      setTimeout(() => {
        finalScoreEl.textContent = Math.floor(score);
        gameHighScoreEl.textContent = highScore;
        gameOverMenu.style.display = 'flex';
      }, 600);
    }

    function update() {
      frame++;
      score += 0.05;

      // Smooth ship movement easing
      player.x += (player.targetX - player.x) * 0.18;
      player.y += (player.targetY - player.y) * 0.18;

      // Bound ship inside canvas
      player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));

      // Auto-fire twin lasers every 10 frames
      if (frame % 10 === 0) {
        spawnLasers();
      }

      // Ship engine trail particles
      if (frame % 2 === 0) {
        particles.push({
          x: player.x + (Math.random() - 0.5) * 6,
          y: player.y + 12,
          vx: (Math.random() - 0.5) * 0.5,
          vy: Math.random() * 2 + 2,
          radius: Math.random() * 2.5 + 1,
          color: '#00f3ff',
          alpha: 0.8
        });
      }

      // Spawners
      if (frame % Math.max(12, Math.floor(35 - score * 0.03)) === 0) spawnEnemy();
      if (frame % 120 === 0) spawnGem();

      // Update Lasers & Check Asteroid Hits
      for (let i = lasers.length - 1; i >= 0; i--) {
        let l = lasers[i];
        l.y += l.vy;

        let laserHit = false;

        // Check laser against enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
          let e = enemies[j];
          let dist = Math.hypot(l.x - e.x, l.y - e.y);

          if (dist < e.radius + l.w + 2) {
            // Asteroid Destroyed!
            createExplosion(e.x, e.y, '#ff0055', 18);
            score += 15;
            if (navigator.vibrate) navigator.vibrate(15);
            enemies.splice(j, 1);
            laserHit = true;
            break;
          }
        }

        if (laserHit || l.y < -20) {
          lasers.splice(i, 1);
        }
      }

      // Update Enemies (Collision with Player)
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        e.rot += e.rotSpeed;

        let dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.radius + e.radius - 2) {
          gameOver();
        }

        if (e.y > H + e.radius) enemies.splice(i, 1);
      }

      // Update Gems
      for (let i = gems.length - 1; i >= 0; i--) {
        let g = gems[i];
        g.y += g.speed;

        let dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < player.radius + g.radius + 5) {
          score += 30;
          createExplosion(g.x, g.y, '#00f3ff', 15);
          if (navigator.vibrate) navigator.vibrate(20);
          gems.splice(i, 1);
        } else if (g.y > H + g.radius) {
          gems.splice(i, 1);
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.save();

      // Screen Shake
      if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * 10;
        let dy = (Math.random() - 0.5) * 10;
        ctx.translate(dx, dy);
        shakeTime--;
      }

      // Clear Screen
      ctx.fillStyle = '#090a16';
      ctx.fillRect(0, 0, W, H);

      // Grid Background
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 30;
      const offset = (frame * 1.5) % gridSize;
      for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = offset; y < H; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // Draw Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Lasers
      lasers.forEach(l => {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = l.color;
        ctx.fillStyle = l.color;
        ctx.fillRect(l.x - l.w / 2, l.y, l.w, l.h);
        ctx.restore();
      });

      if (isPlaying) {
        // Draw Player Ship
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f3ff';
        ctx.strokeStyle = '#00f3ff';
        ctx.fillStyle = '#090a16';
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(0, -player.radius - 4);
        ctx.lineTo(player.radius + 2, player.radius + 4);
        ctx.lineTo(0, player.radius);
        ctx.lineTo(-player.radius - 2, player.radius + 4);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // Draw Enemies
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rot);
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff0055';
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 2;

        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          let angle = (i * Math.PI) / 3;
          let r = e.radius * (i % 2 === 0 ? 1 : 0.7);
          let x = Math.cos(angle) * r;
          let y = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      });

      // Draw Gems
      gems.forEach(g => {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f3ff';
        ctx.fillStyle = '#00f3ff';
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw HUD Score
      if (isPlaying) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 40);
      }

      ctx.restore();
    }

    function gameLoop() {
      if (!isPlaying && particles.length === 0) return;
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
